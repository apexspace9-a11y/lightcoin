name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          printf "rootProject.name = 'wrapper'\n" > "$tmp_dir/settings.gradle"
          gradle -p "$tmp_dir" wrapper --gradle-version 8.14
          cp "$tmp_dir/gradlew" android/gradlew
          cp "$tmp_dir/gradlew.bat" android/gradlew.bat
          cp "$tmp_dir/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tiet-Kiem-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiet-Kiem-1.0.0
          path: build/app/outputs/flutter-apk/Tiet-Kiem-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
